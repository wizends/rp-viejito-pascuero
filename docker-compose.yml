name: buzon-viejito-pascuero

services:
  # API en Go con SQLite: la base y las fotos de las cartas viven en el volumen "datos"
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - datos:/app/data

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  datos:
